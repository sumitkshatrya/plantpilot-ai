services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plantpilot-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OPENBLAS_NUM_THREADS=1
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
    volumes:
      # Mount document directory read-only so new SOPs can be added without image rebuilds
      - ./backend/documents:/app/documents:ro
      # Persist ChromaDB vector collection
      - chroma_data:/app/chroma_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: plantpilot-frontend
    ports:
      # Expose port 5173 to match the standard Vite port and plant documentation
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma_data:
    driver: local
